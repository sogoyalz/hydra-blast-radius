name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor the project claims in package.json's engines field
        # (it is where global fetch arrives, which this code relies on with no
        # polyfill). Testing the floor and a current release together is what
        # makes that claim worth anything.
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step on purpose: this project has zero third-party
      # dependencies and no lockfile, so there is nothing to restore. If that
      # ever stops being true, this job starts failing, which is the intended
      # alarm rather than an inconvenience.
      - name: Unit tests
        run: npm test
      # A stray NUL byte makes git classify a source file as binary, which
      # hides every diff in it on GitHub — reviewers and judges see "Binary
      # file not shown" instead of the code. It has happened twice in
      # src/hydra.js, both times from an id-namespace separator, and neither
      # time did anything fail: tests pass, the code runs, and the only symptom
      # is the file quietly becoming unreadable in review. `grep` cannot be
      # used to check (it will not match NUL in a pattern and reports a clean
      # file), so this reads the bytes directly.
      - name: Assert no source file contains a NUL byte
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const roots = ["src", "frontend", "test", "bench", "scripts"];
            let bad = 0;
            for (const dir of roots) {
              for (const name of fs.readdirSync(dir)) {
                const p = path.join(dir, name);
                if (!fs.statSync(p).isFile()) continue;
                const at = fs.readFileSync(p).indexOf(0);
                if (at !== -1) {
                  console.error(`NUL byte in ${p} at offset ${at} — git will treat this file as binary and hide its diff.`);
                  bad++;
                }
              }
            }
            if (bad > 0) process.exit(1);
            console.log("No NUL bytes in any source file.");
          '
      - name: Assert the dependency-free claim still holds
        run: |
          if [ -d node_modules ]; then
            echo "node_modules exists — the zero-dependency claim in the README is stale."
            exit 1
          fi
          node -e '
            const pkg = require("./package.json");
            const deps = { ...(pkg.dependencies ?? {}), ...(pkg.devDependencies ?? {}) };
            const names = Object.keys(deps);
            if (names.length > 0) {
              console.error("Third-party dependencies declared: " + names.join(", "));
              process.exit(1);
            }
            console.log("No third-party dependencies declared.");
          '
